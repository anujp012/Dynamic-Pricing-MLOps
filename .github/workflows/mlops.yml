name: MLOps Automated Pipeline

on:
  push:
    branches: [ main ]  # Triggers every time you push code

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install evidently  # Ensure drift tool is installed

      - name: Run Drift Analysis
        run: python generate_drift.py

      - name: Build Docker Image
        run: |
          docker build -t mlops-app:latest .
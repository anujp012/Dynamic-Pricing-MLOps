name: MLOps Automated Pipeline

on:
  push:
    branches: [ main ]
    
  schedule:
    - cron: "0 */6 * * *"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      ALLOW_DRIFT: "true"   

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install pandas evidently

      - name: Run Drift Analysis
        run: python generate_drift.py

      - name: Build Docker Image
        run: docker build -t mlops-app:latest .

      - name: Upload Drift Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlops-drift-report
          path: drift_report.html

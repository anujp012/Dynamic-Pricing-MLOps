name: MLOps Automated Pipeline

on:
  push:
    branches: [ main ]
  schedule:
    - cron: "0 */12 * * *"       # Every 12 hours automatically
  workflow_dispatch:
    inputs:
      force_drift:
        description: "Force drift to trigger retraining (true/false)"
        required: false
        default: "false"

jobs:

  # ══ JOB 1: Drift Detection ════════════════════════════════════════
  drift-detection:
    name: "01 — Evidently Drift Analysis"
    runs-on: ubuntu-latest
    outputs:
      drift_detected: ${{ steps.drift_check.outputs.drift_detected }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Setup SQLite Database
        run: python setup_db.py

      - name: Run Drift Analysis
        id: drift_check
        env:
          DRIFT_THRESHOLD: "0.1"
          ALLOW_DRIFT: "false"
          FORCE_DRIFT: ${{ github.event.inputs.force_drift || 'false' }}
        run: |
          set +e
          python generate_drift.py
          EXIT_CODE=$?
          set -e
          if [ $EXIT_CODE -eq 1 ]; then
            echo "drift_detected=true"  >> $GITHUB_OUTPUT
            echo "⚠️ DRIFT DETECTED — retraining will trigger"
          else
            echo "drift_detected=false" >> $GITHUB_OUTPUT
            echo "✅ No drift — pipeline complete, skipping retrain"
          fi

      - name: Upload Evidently Drift Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlops-drift-report
          path: drift_report.html

  # ══ JOB 2: Retrain — ONLY runs when drift detected ════════════════
  retrain:
    name: "02 — XGBoost Retrain + MLflow Log"
    needs: drift-detection
    if: needs.drift-detection.outputs.drift_detected == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Clean broken mlruns folder
        run: rm -rf mlruns

      - name: Retrain XGBoost Model
        run: python train_mini.py

      - name: Upload Retrained Model
        uses: actions/upload-artifact@v4
        with:
          name: retrained-model
          path: |
            model.pkl
            features.pkl

  # ══ JOB 3: Docker Build — ONLY after retrain ══════════════════════
  build:
    name: "03 — Docker Build & Push"
    needs: retrain
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Retrained Model
        uses: actions/download-artifact@v4
        with:
          name: retrained-model

      - name: Build Docker Image
        run: docker build -t mlops-app:latest .

      # Uncomment after adding DOCKER_USERNAME + DOCKER_PASSWORD to GitHub Secrets
      # - name: Push to Docker Hub
      #   run: |
      #     echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
      #     docker tag mlops-app:latest ${{ secrets.DOCKER_USERNAME }}/mlops-app:latest
      #     docker push ${{ secrets.DOCKER_USERNAME }}/mlops-app:latest

  # ══ JOB 4: Kubernetes Deploy — ONLY after Docker build ════════════
  deploy:
    name: "04 — Kubernetes Rolling Deploy"
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true       # K8s runs on local minikube — expected to skip in CI

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create k8s Kind Cluster
        uses: helm/kind-action@v1.8.0

      - name: Create Namespace
        run: kubectl create namespace mlops --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply Kubernetes Manifests
        run: |
          kubectl apply --validate=false -f deployment.yaml || echo "⚠️ deployment.yaml skipped"
          kubectl apply --validate=false -f service.yaml    || echo "⚠️ service.yaml skipped"
          kubectl get nodes
          kubectl get pods -n mlops || kubectl get pods